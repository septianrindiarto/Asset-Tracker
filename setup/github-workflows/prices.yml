name: prices

on:
  # Pemicu utama: Cloudflare Worker memanggil ini tepat waktu (lihat worker/).
  workflow_dispatch:
    inputs:
      trigger:
        description: "Sumber pemicu (untuk log)"
        default: "manual"
      simulate_fail:
        description: "Uji kegagalan, mis. xau atau xau,antam (kosongkan untuk normal)"
        default: ""
  # Pemicu cadangan bila Worker gagal. Dilewati otomatis jika sudah sukses <60 menit.
  # 02:40, 06:40, 10:40, 14:40 UTC = 09:40, 13:40, 17:40, 21:40 WIB
  schedule:
    - cron: "40 2,6,10,14 * * *"

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jobs/requirements.txt
      - run: pip install -r jobs/requirements.txt
      - name: Ambil harga
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          METALCHARTS_API_KEY: ${{ secrets.METALCHARTS_API_KEY }}
          TRIGGER: ${{ github.event_name == 'schedule' && 'github-schedule' || inputs.trigger }}
          SIMULATE: ${{ inputs.simulate_fail }}
          SKIP: ${{ github.event_name == 'schedule' && '60' || '0' }}
        run: python -m jobs.prices --trigger "$TRIGGER" --simulate-fail "$SIMULATE" --skip-if-recent-min "$SKIP"
